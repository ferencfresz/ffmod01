[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ffmod"
version = "0.2.0"
description = "Zero-Training Coarse-to-Fine Weight-Indexed Sparse SwiGLU/GeGLU Engine in Triton"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.45.0",
    "safetensors>=0.4.0",
]

[project.scripts]
ffmod-serve = "ffmod.server:cli_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ffmod*"]
